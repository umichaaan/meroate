  .q.two { font-size: 1.1rem; min-height: 3.6rem; display: flex; align-items: center; justify-content: center; }

  .mv-link { display: block; width: fit-content; max-width: 100%; margin: 12px auto 0; padding: 8px 14px; border-radius: 999px;
    border: 1.5px solid var(--line); background: #fff; color: var(--sub); font-size: .9rem; font-weight: 500;
    text-decoration: underline; text-underline-offset: 3px; box-shadow: none; }
  .mv-link:active { transform: none; box-shadow: none; }
  .mv-link:focus-visible { outline: 3px solid var(--accent-text); outline-offset: 3px; }
  button.link { border: 0; background: transparent; box-shadow: none; color: var(--sub); font-size: .9rem; padding: 8px; }
  button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--btn-shadow); }
  button.link:active { transform: none; box-shadow: none; }
  button:focus-visible { outline: 3px solid var(--accent-text); outline-offset: 3px; }
  button:disabled { color: var(--ink); cursor: default; box-shadow: none; }

  li { padding: 6px 0; border-bottom: 1px solid var(--line); text-align: left; font-size: .95rem; }
  .sec { margin-top: 22px; }
  .grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
  .chip { padding: 8px 16px; font-size: .95rem; border-radius: 999px; }
  .backrow { text-align: left; }

  .answer-big.no { color: var(--no); background: linear-gradient(transparent 62%, var(--pop2) 62%); }

  .badge.no { color: var(--no); }

        else unknown++;
      });
      if (yes === 0 || no === 0) continue;       // 絞り込めない質問は使わない
      options.push({ q: q, score: Math.abs(yes - no) + unknown });   // 点数は小さいほど、いい質問
    }
    if (options.length === 0) return -1;         // 使える質問がなければ -1
    const best = Math.min(...options.map(o => o.score));
    // いちばんいい質問との差が、MARGIN の範囲に入る質問から、ランダムに選ぶ
    const margin = Math.max(2, Math.round(cands.length * MARGIN));
    const pool = options.filter(o => o.score <= best + margin);
    return pool[Math.floor(Math.random() * pool.length)].q;
  }

  // いま画面に出している質問を覚えておく
  // (ランダムに選ぶので、画面に出した質問と、答えとして記録する質問がずれないようにするため)
  function currentKey() { return answers.length + ":" + rejected.length; }
  function pickQuestion(cands) {
    const key = currentKey();
    if (!shown || shown.key !== key) shown = { key: key, q: nextQuestion(cands) };
    return shown.q;
  }

  // 画面に部品を作る小さな道具
  function el(tag, className, text) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function button(label, className, onClick) {
    const b = el("button", className, label);
    b.addEventListener("click", onClick);
    return b;
  }

  function answer(a) {
    const cands = candidates();
    answers.push({ q: pickQuestion(cands), a: a });
    render();
  }
  function restart() {
    answers = []; started = false;
    mode = null; target = null; asked = []; wrong = []; finished = null;
    rejected = []; found = null; shown = null;
    panel = null;
    render();
  }

  // ===== 「これですか?」と聞く画面 =====
  function guessScreen(screen, song) {
    screen.append(
      el("p", "small", "思い浮かべているのは"),
      el("p", "big", "「" + song.name + "」"),
      el("p", "q", "ですか?")
    );
    const box = el("div", "btns");
    box.append(
      button("はい", "main", () => { found = song.name; render(); }),
      button("いいえ", "", () => { rejected.push(song.name); render(); })   // 外れた曲は、もう出さない
    );
    actionsEl.append(box);
  }

  // ===== データ診断: 全曲を区別できる質問になっているか調べる =====
  function renderCheck(screen) {
    screen.append(el("p", "q", "データ診断"));

    // 1. 答えの並びがまったく同じ曲を探す(どんな質問でも区別できない曲)
    const groups = {};
    SONGS.forEach(s => {
      const key = s.answers.join(",");    // 答えの並びを、1つの文字にする
      (groups[key] = groups[key] || []).push(s.name);
    });
    const same = Object.values(groups).filter(g => g.length > 1);

    if (same.length === 0) {
      screen.append(el("p", "small", "✓ 答えの並びが同じ曲はありません"));
    } else {
      screen.append(el("p", "small", "区別できない曲があります。質問を足すか、答えを見直してください"));
      const ul = el("ul");
      same.forEach(g => ul.appendChild(el("li", "", g.join(" / "))));
      screen.append(ul);
    }

    // 2. 質問ごとの はい / いいえ / null の数
    screen.append(el("p", "small sec", "質問ごとの はい / いいえ / null の数(どちらかに偏った質問は、あまり役に立ちません)"));
    const ul2 = el("ul");
    QUESTIONS.forEach((text, q) => {
      let yes = 0, no = 0, nul = 0;
      SONGS.forEach(s => {
        if (s.answers[q] === 1) yes++;
        else if (s.answers[q] === 0) no++;
        else nul++;
      });
      ul2.appendChild(el("li", "", text + " → " + yes + " / " + no + " / " + nul));
    });
    screen.append(ul2, button("もどる", "main", restart));
  }

  // 答え(1 / 0 / null)を、表示する文字と色の名前にする
  function ansLabel(a) { return a === 1 ? "はい" : a === 0 ? "いいえ" : "どちらとも言えない"; }
  function ansClass(a) { return a === 1 ? "yes" : a === 0 ? "no" : "maybe"; }

  // 結果画面に、質問回数と曲のクレジットを表示する
  function addCredits(screen, song, questionCount, wrongCount = null) {
    screen.append(el("p", "small credit-line", "質問回数　" + questionCount + "回"));
    if (wrongCount !== null) {
      screen.append(el("p", "small credit-line", "ハズレ　" + wrongCount + "回"));
    }
    if (song.lyrics && song.lyrics.length) {
      screen.append(el("p", "small credit-line", "作詞　" + song.lyrics.join("・")));
    }
    if (song.composer) {
      screen.append(el("p", "small credit-line", "作曲　" + song.composer));
    }
    if (song.mvDate) {
      const m = song.mvDate.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      const dateText = m ? Number(m[1]) + "年" + Number(m[2]) + "月" + Number(m[3]) + "日" : song.mvDate;
      screen.append(el("p", "small credit-line", "MV投稿日　" + dateText));
    }
    // MVリンクはMV投稿日（または他のクレジット）の直後に表示する
    addMvLink(screen, song);
  }

  function addMvLink(container, song) {
    if (!song.url) return;
    const link = el("a", "mv-link", "MVを視聴する");
    link.href = song.url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.setAttribute("aria-label", song.name + "のMVを視聴する(新しいタブで開く)");
    container.append(link);
  }
  // Xの投稿画面を開く
function addPostButton(actions, song, questionCount, resultType) {
  const isWatermelon = WATERMELON_SONGS.has(song.name);
  const title = isWatermelon
    ? "めっちゃかっこいいすいぱかの曲を当てる"
    : "めっちゃかっこいいめろぱかの曲を当てる";
  const emoji = isWatermelon ? "🍉" : "🍈";

  const text =
    title + "\n" +
    (resultType === "当てられなかった"
  ? "「" + song.name + "」を当てられなかった😢"
  : "「" + song.name + "」を" + resultType + emoji) + "\n" +
    "質問回数：" + questionCount + "回　#めろあて\n\n" +
    "あなたも挑戦👇\n" + SITE_URL;

  actions.append(button("𝕏でポストする", "", () => {
    const url = "https://twitter.com/intent/tweet?text=" +
      encodeURIComponent(text);
    window.open(url, "_blank", "noopener,noreferrer");
  }));
}

  // ===== 自分が当てるモードの画面 =====
  // 画面は4つ: ①3つのボタンの画面 / ②質問の一覧 / ③曲の一覧 / ④降参の確認
  // panel という変数に、いまどの画面かを入れています
  function show(name) {
    panel = name;
    render();
    if (typeof window !== "undefined") window.scrollTo(0, 0);   // 画面を切り替えたら、いちばん上へ
  }

  // 「← もどる」ボタン(①の画面にもどる)
  function backRow() {
    const row = el("div", "backrow");
    row.append(button("← もどる", "link", () => show(null)));
    return row;
  }

  // いちばん新しい質問と、その答え(大きく)を、box の中に出す
  function addLatest(box, hint) {
    if (asked.length === 0) { box.append(el("p", "small", hint)); return; }
    const last = asked[asked.length - 1];
    box.append(
      el("p", "small", QUESTIONS[last.q]),
      el("p", "answer-big " + ansClass(last.a), ansLabel(last.a))
    );
  }

  function renderPlayer(screen) {
    screen.append(el("p", "small", "質問 " + asked.length + "回 / ハズレ " + wrong.length + "回"));

    if (finished === "win") {
      screen.append(
        el("p", "small", "正解!"),
        el("p", "big", "「" + target.name + "」")
      );
      addCredits(screen, target, asked.length, wrong.length);
      actionsEl.append(button("もう一度あそぶ", "main", restart));
      addPostButton(actionsEl, target, asked.length, "当てた");
      return;
    }
    if (finished === "giveup") {
      screen.append(
        el("p", "small", "答えは…"),
        el("p", "big", "「" + target.name + "」")
      );
      addCredits(screen, target, asked.length, wrong.length);
      actionsEl.append(button("もう一度あそぶ", "main", restart));
      addPostButton(actionsEl, target, asked.length, "当てられなかった");
      return;
    }

    // ① 3つのボタンの画面: 質問を選ぶ / 回答する / 降参する
    if (panel === null) {
      const latest = el("div", "latest");
      addLatest(latest, "まだ質問していません");
      const hub = el("div", "btns");
      hub.append(
        button("質問を選ぶ", "main", () => show("questions")),
        button("回答する", "", () => show("answer")),
        button("降参する", "", () => show("giveup"))
      );
      screen.append(latest);
      actionsEl.append(hub);
      return;
    }

    // ② 質問の一覧(した質問は押せなくして、そこに答えを表示する)
    if (panel === "questions") {
      const head = el("div", "latest");   // 上に固定される部分
      head.append(backRow());
      addLatest(head, "質問を押すと、答えがここに大きく出ます");
      const qbox = el("div", "btns");
      QUESTIONS.forEach((text, q) => {
        const done = asked.find(x => x.q === q);          // この質問は、もうしたか
        const b = el("button", "qbtn" + (done ? " done" : ""));
        b.append(el("span", "", text));
        if (done) {
          b.disabled = true;                                // 押せなくする
          b.append(el("span", "badge " + ansClass(done.a), ansLabel(done.a)));
        } else {
          // 正解の曲の答え(target.answers[q])を、そのまま記録する
          b.addEventListener("click", () => { asked.push({ q: q, a: target.answers[q] }); render(); });
        }
        qbox.append(b);
      });
      qbox.append(button("もどる", "", () => show(null)));   // 一覧のいちばん下にも、戻るボタン
      screen.append(head);
      actionsEl.append(qbox);
      return;
    }

    // ③ 曲の一覧(曲名を答える): 質問ボタンと同じ大きさ・形のボタン
    if (panel === "answer") {
      const head = el("div", "latest");
      head.append(backRow(), el("p", "small", "曲名をえらんでください"));
      const sbox = el("div", "btns");
      SONGS.forEach(s => {
        if (wrong.includes(s.name)) return;   // はずした曲は、もう出さない
        sbox.append(button(s.name, "qbtn", () => {
          if (s.name === target.name) finished = "win";
          else wrong.push(s.name);
          render();
        }));
      });
      sbox.append(button("もどる", "", () => show(null)));   // 一覧のいちばん下にも、戻るボタン
      screen.append(head);
      actionsEl.append(sbox);
      return;
    }

    // ④ 降参の確認
    if (panel === "giveup") {
      const box = el("div", "btns");
      box.append(
        button("はい", "", () => { finished = "giveup"; render(); }),
        button("いいえ", "", () => show(null))
      );
      screen.append(el("p", "q", "降参してよろしいですか?"));
      actionsEl.append(box);
    }
  }

  function render() {
    const screen = document.getElementById("screen");   // 上の枠(文字を入れる)
    screen.textContent = "";
    actionsEl.textContent = "";

    // 隠し演出は、対象曲の答えが確定して表示される場面だけ有効にする
    const watermelonMode =
      (mode === "ai" && found !== null && WATERMELON_SONGS.has(found)) ||
      (mode === "player" && target !== null &&
        WATERMELON_SONGS.has(target.name) &&
        (finished === "win" || finished === "giveup"));
    document.body.classList.toggle("watermelon-mode", watermelonMode);
    document.title = (watermelonMode
      ? "めっちゃかっこいいすいぱかの曲を当てる"
      : TITLE.split("|").join(""));

    // 短い画面は縦の真ん中に置く。長い一覧の画面(質問の一覧・曲の一覧・データ診断)は、上を基準にする
    const listScreen = mode === "player" && !finished && (panel === "questions" || panel === "answer");
    const tall = mode === "check" || listScreen;
    document.getElementById("page").className = tall ? "" : "center";
    // 質問や曲の一覧の画面では、上の四角(文字)を画面の上に固定する
    screen.className = listScreen ? "card sticky" : "card";

    // いちばん上のタイトルの四角: 最初の画面だけ大きく、改行して出す
    const titleBox = document.getElementById("titlebox");
    const h = document.getElementById("title");
    h.textContent = "";
    const activeTitle = watermelonMode
      ? "めっちゃかっこいい|すいぱかの|曲を当てる"
      : TITLE;
    const [t1, t2, t3] = activeTitle.split("|");
    if (mode === null) {
      titleBox.className = "card big";
      h.append(t1, document.createElement("br"), t2, document.createElement("br"), t3);   // 3行
    } else {
      titleBox.className = "card";
      h.textContent = t1 + t2 + t3;   // ほかの画面は、細い四角に1行で出す
    }

    // --- モード選択画面 ---
    if (mode === null) {
      const box = el("div", "btns");
      box.append(
        button("当ててもらう", "main", () => { mode = "ai"; render(); }),
        button("自分で当てる", "", () => {
          mode = "player";
          target = SONGS[Math.floor(Math.random() * SONGS.length)];  // ランダムに1曲えらぶ
          render();
        })
      );
      actionsEl.append(box);
      return;
    }
    if (mode === "player") { renderPlayer(screen); return; }
    if (mode === "check") { renderCheck(screen); return; }

    // --- スタート画面 ---
    if (!started) {
      const lead = el("p", "big lead");
      lead.append(ARTIST + "の曲を", document.createElement("br"), "思い浮かべてください");
      screen.append(lead);
      actionsEl.append(button("スタート", "main", () => { started = true; render(); }));
      return;
    }

    const cands = candidates();

    // --- 当たった ---
    if (found) {
      screen.append(el("p", "big", "「" + found + "」"));
      const foundSong = SONGS.find(song => song.name === found);
      if (foundSong) {
        addCredits(screen, foundSong, answers.length);
        actionsEl.append(button("もう一度あそぶ", "main", restart));
        addPostButton(actionsEl, foundSong, answers.length, "当てられた");
      } else {
        actionsEl.append(button("もう一度あそぶ", "main", restart));
      }
      return;
    }

    // --- 候補が1つ: 「これですか?」と聞く ---
    if (cands.length === 1) { guessScreen(screen, cands[0]); return; }

    // --- 候補がゼロ: 答えが食い違った ---
    if (cands.length === 0) {
      screen.append(
        el("p", "q", "わかりませんでした…"),
        el("p", "small", "この曲は、データに入っていないのかもしれません")
      );
      actionsEl.append(button("もう一度あそぶ", "main", restart));
      return;
    }

    const q = pickQuestion(cands);

    // --- 質問がもうない: いちばん近い曲から順に「これですか?」と聞く ---
    if (q === -1) { guessScreen(screen, cands[0]); return; }

    // --- 質問を出す ---
    screen.append(
      el("p", "small", "質問 " + (answers.length + 1)),
      el("p", "q two", QUESTIONS[q])
    );
    const box = el("div", "btns");
    box.append(
      button("はい", "main", () => answer(1)),
      button("たぶんそう", "", () => answer(0.5)),
      button("わからない", "", () => answer(0)),
      button("たぶん違う", "", () => answer(-0.5)),
      button("いいえ", "", () => answer(-1))
    );
    actionsEl.append(box);
    // 「ひとつ戻る」は、最初の質問のときは見えないだけで、場所は取っておく(ボタンの位置がずれないように)
    const back = button("ひとつ戻る", "link", () => {
      const last = answers.pop();
      shown = { key: currentKey(), q: last.q };   // 戻ったときは、前と同じ質問を出す
      render();
    });
    if (answers.length === 0) { back.className += " ghost"; back.disabled = true; }
    actionsEl.append(back);
  }

  document.title = TITLE.split("|").join("");

  // データの書き間違いを、開発者ツールのConsoleで知らせる
  SONGS.forEach(s => {
    if (s.answers.length !== QUESTIONS.length) {
      console.warn("答えの数が合っていません:", s.name);
    }
  });

  if (location.hash === "#check") mode = "check";   // データ診断(アドレスの末尾に #check)
  render();
</script>
</body>
</html>
